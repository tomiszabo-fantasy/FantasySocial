.app-shell { display: block; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #FF7A1A, #22E5FF); flex-shrink: 0; }
.brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.2px; }
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 224px; background: #0E0F14; border-right: 1px solid rgba(255,255,255,0.08); overflow-y: auto; z-index: 50; transition: transform .25s ease; }
.sidebar-header { display: flex; align-items: center; gap: 8px; padding: 20px 18px; }
.sidebar-home-btn { display: flex; align-items: center; gap: 8px; margin: 0 12px 10px; padding: 9px 10px; border-radius: 8px; font-size: 15px; font-weight: 600; color: #F5F6FA; background: rgba(255,255,255,0.05); }
.sidebar-home-btn i { font-size: 16px; color: #22E5FF; }
.sidebar-home-btn:hover { background: rgba(255,255,255,0.09); }
.sidebar-tree { padding: 6px 12px 24px; }
.nav-node { }
.nav-row { display: flex; align-items: center; gap: 2px; }
.nav-toggle { width: 22px; height: 22px; border: none; background: transparent; color: #9497A6; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform .15s ease; font-size: 15px; }
.nav-toggle.leaf { visibility: hidden; }
.nav-node.open > .nav-row .nav-toggle i { transform: rotate(90deg); }
.nav-link { flex: 1; padding: 7px 6px; font-size: 15px; color: #C7C9D6; border-radius: 8px; }
.nav-link:hover { background: rgba(255,255,255,0.06); }
.nav-link.active { color: #22E5FF; font-weight: 600; background: rgba(34,229,255,0.1); }
.nav-children { display: none; margin-left: 18px; border-left: 1px solid rgba(255,255,255,0.07); padding-left: 6px; }
.nav-node.open > .nav-children { display: block; }
.main-content { flex: 1; margin-left: 224px; min-width: 0; }
.topbar { display: none; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.hamburger-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: #14151C; color: #F5F6FA; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 18px; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; }
@media (max-width: 880px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .topbar { display: flex; }
  .sidebar-backdrop.open { display: block; }
}
.page-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; padding: 28px 24px 0; }
.page-subtitle { font-size: 11px; color: #9497A6; text-transform: uppercase; letter-spacing: 1px; padding: 4px 24px 0; }
.card-social-row { display: flex; justify-content: center; gap: 8px; padding: 10px 8px 12px; }
.card-social-btn { width: 30px; height: 30px; border-radius: 50%; background: #14151C; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 13px; text-decoration: none; }
.section { padding: 24px; }
.tagline { text-align: center; font-size: 13px; color: #9497A6; margin-bottom: 28px; }
.grid { display: grid; gap: 14px; max-width: 640px; margin: 0 auto; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 640px) { .grid-2.wide-3 { grid-template-columns: repeat(3, 1fr); } }
.glass-tile { display: block; background: #14151C; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 18px; }
.glass-tile .swatch { width: 100%; height: 48px; border-radius: 10px; margin-bottom: 14px; }
.glass-tile .tile-label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; }
.glass-tile .tile-sub { font-size: 12px; color: #9497A6; margin-top: 3px; }
.icon-tile { display: flex; flex-direction: column; gap: 10px; background: #14151C; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 20px; }
.icon-tile i { font-size: 24px; color: #22E5FF; }
.icon-tile .tile-label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; }
.icon-tile .tile-sub { font-size: 11px; color: #9497A6; text-transform: uppercase; letter-spacing: 0.5px; }
.empty { text-align: center; color: #9497A6; font-size: 14px; grid-column: 1 / -1; }
.thumb { background: #14151C; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; overflow: hidden; }
.thumb img { width: 100%; display: block; }
.share-btn { width: 100%; padding: 14px; border: none; background: linear-gradient(90deg, #FF7A1A, #22E5FF); color: #0B0C10; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.lightbox { position: fixed; inset: 0; background: rgba(5,6,9,0.92); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.lightbox-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: #16171F; color: #F5F6FA; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
.lightbox-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: #16171F; color: #F5F6FA; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; }
.lightbox-arrow-left { left: 16px; }
.lightbox-arrow-right { right: 16px; }
</style>
