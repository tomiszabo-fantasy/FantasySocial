<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fantasy Social</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');

html, body { background-color: #0B0C10; }

  color: #F5F6FA; font-family: 'Inter', sans-serif; min-height: 100vh;
}

  background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOTAiIGhlaWdodD0iMTgwIj48cGF0aCBkPSJNMCw0MCBINzAgVjExMCBIMTkwIiBmaWxsPSJub25lIiBzdHJva2U9IiNGRjZBM0QiIHN0cm9rZS13aWR0aD0iMS40IiBvcGFjaXR5PSIwLjE0Ii8+PHBhdGggZD0iTTQwLDAgVjYwIEgxOTAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0ZGNkEzRCIgc3Ryb2tlLXdpZHRoPSIxLjQiIG9wYWNpdHk9IjAuMSIvPjxwYXRoIGQ9Ik0wLDE1MCBIOTAgVjE4MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjRkY2QTNEIiBzdHJva2Utd2lkdGg9IjEuNCIgb3BhY2l0eT0iMC4xMiIvPjxjaXJjbGUgY3g9IjcwIiBjeT0iNDAiIHI9IjIuNSIgZmlsbD0iI0ZGNkEzRCIgb3BhY2l0eT0iMC4yNSIvPjxjaXJjbGUgY3g9IjcwIiBjeT0iMTEwIiByPSIyLjUiIGZpbGw9IiNGRjZBM0QiIG9wYWNpdHk9IjAuMiIvPjxjaXJjbGUgY3g9IjQwIiBjeT0iNjAiIHI9IjIuNSIgZmlsbD0iI0ZGNkEzRCIgb3BhY2l0eT0iMC4yIi8+PHJlY3QgeD0iODYiIHk9IjE0NiIgd2lkdGg9IjgiIGhlaWdodD0iOCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjRkY2QTNEIiBzdHJva2Utd2lkdGg9IjEiIG9wYWNpdHk9IjAuMiIvPjwvc3ZnPg==');
  background-repeat: repeat;
  padding-bottom: 60px;
}
.app-shell { display: flex; align-items: flex-start; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #FF7A1A, #22E5FF); flex-shrink: 0; }
.brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.2px; }
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 224px; background: #0E0F14; border-right: 1px solid rgba(255,255,255,0.08); overflow-y: auto; z-index: 50; transition: transform .25s ease; }
.sidebar-header { display: flex; align-items: center; gap: 8px; padding: 20px 18px; }
.sidebar-home-btn { display: flex; align-items: center; gap: 8px; margin: 0 12px 10px; padding: 9px 10px; border-radius: 8px; font-size: 15px; font-weight: 600; color: #F5F6FA; background: rgba(255,255,255,0.05); }
.sidebar-home-btn i { font-size: 16px; color: #22E5FF; }
.sidebar-home-btn:hover { background: rgba(255,255,255,0.09); }
.sidebar-tree { padding: 6px 12px 24px; }
.nav-node { }
.nav-row { display: flex; align-items: center; gap: 2px; }
.nav-toggle { width: 22px; height: 22px; border: none; background: transparent; color: #9497A6; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform .15s ease; font-size: 15px; }
.nav-toggle.leaf { visibility: hidden; }
.nav-node.open > .nav-row .nav-toggle i { transform: rotate(90deg); }
.nav-link { flex: 1; padding: 7px 6px; font-size: 15px; color: #C7C9D6; border-radius: 8px; }
.nav-link:hover { background: rgba(255,255,255,0.06); }
.nav-link.active { color: #22E5FF; font-weight: 600; background: rgba(34,229,255,0.1); }
.nav-children { display: none; margin-left: 18px; border-left: 1px solid rgba(255,255,255,0.07); padding-left: 6px; }
.nav-node.open > .nav-children { display: block; }
.main-content { flex: 1; margin-left: 224px; min-width: 0; }
.topbar { display: none; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.hamburger-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: #14151C; color: #F5F6FA; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 18px; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; }
@media (max-width: 880px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .topbar { display: flex; }
  .sidebar-backdrop.open { display: block; }
}
.page-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; padding: 28px 24px 0; }
.page-subtitle { font-size: 11px; color: #9497A6; text-transform: uppercase; letter-spacing: 1px; padding: 4px 24px 0; }
.card-social-row { display: flex; justify-content: center; gap: 8px; padding: 10px 8px 12px; }
.card-social-btn { width: 30px; height: 30px; border-radius: 50%; background: #14151C; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 13px; text-decoration: none; }
.section { padding: 24px; }
.tagline { text-align: center; font-size: 13px; color: #9497A6; margin-bottom: 28px; }
.grid { display: grid; gap: 14px; max-width: 640px; margin: 0 auto; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 640px) { .grid-2.wide-3 { grid-template-columns: repeat(3, 1fr); } }
.glass-tile { display: block; background: #14151C; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 18px; }
.glass-tile .swatch { width: 100%; height: 48px; border-radius: 10px; margin-bottom: 14px; }
.glass-tile .tile-label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; }
.glass-tile .tile-sub { font-size: 12px; color: #9497A6; margin-top: 3px; }
.icon-tile { display: flex; flex-direction: column; gap: 10px; background: #14151C; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 20px; }
.icon-tile i { font-size: 24px; color: #22E5FF; }
.icon-tile .tile-label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; }
.icon-tile .tile-sub { font-size: 11px; color: #9497A6; text-transform: uppercase; letter-spacing: 0.5px; }
.empty { text-align: center; color: #9497A6; font-size: 14px; grid-column: 1 / -1; }
.thumb { background: #14151C; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; overflow: hidden; }
.thumb img { width: 100%; display: block; }
.share-btn { width: 100%; padding: 14px; border: none; background: linear-gradient(90deg, #FF7A1A, #22E5FF); color: #0B0C10; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.lightbox { position: fixed; inset: 0; background: rgba(5,6,9,0.92); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.lightbox-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: #16171F; color: #F5F6FA; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
.lightbox-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: #16171F; color: #F5F6FA; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; }
.lightbox-arrow-left { left: 16px; }
.lightbox-arrow-right { right: 16px; }
</style></head>
<body>
<div class="app-shell">
<div class="topbar">
  <button class="hamburger-btn" id="hamburger-btn"><i class="ti ti-menu-2"></i></button>
  <div class="brand-mark" style="width:22px;height:22px;"></div>
  <div class="brand-name" style="font-size:14px;">FANTASY SOCIAL</div>
</div>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="brand-mark"></div><div class="brand-name">FANTASY SOCIAL</div></div>
  <a class="sidebar-home-btn" href="../home/"><i class="ti ti-home"></i> Home</a>
  <div class="sidebar-tree" id="sidebar-tree"><div class="empty" style="padding:12px;text-align:left;">Loading…</div></div>
</div>
<div class="main-content"><div class="content-bg"><div class="section" style="padding-top:12px;">
<div class="tagline">Pick a design to browse this season's cards</div>
<div class="grid grid-2"><a class="glass-tile" href="neon/">
<div class="swatch" style="background:linear-gradient(135deg,#FF7A1A,#22E5FF);"></div>
<div class="tile-label">Neon</div>
<div class="tile-sub">Stadium glow style</div>
</a><a class="glass-tile" href="broadcast/">
<div class="swatch" style="background:linear-gradient(135deg,#FF6A3D,#FFB199);"></div>
<div class="tile-label">Broadcast</div>
<div class="tile-sub">TV lower-third style</div>
</a></div>
</div></div></div>
</div>
<script>
(function(){
  var rootPrefix = "../";
  var repoBase = "/FantasySocial/";
  var currentPath = decodeURIComponent(window.location.pathname);
  var idx = currentPath.indexOf(repoBase);
  var relPath = idx >= 0 ? currentPath.slice(idx + repoBase.length) : "";

  function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function nodeHtml(label, href, childrenHtml){
    var isLeaf = !childrenHtml;
    var decodedHref = href ? decodeURIComponent(href) : "";
    var isActive = decodedHref && decodedHref === relPath;
    var isAncestor = decodedHref && relPath.indexOf(decodedHref) === 0 && decodedHref !== relPath;
    var openClass = isAncestor ? " open" : "";
    var linkClass = isActive ? "nav-link active" : "nav-link";
    var toggleClass = isLeaf ? "nav-toggle leaf" : "nav-toggle";
    var linkHref = href ? rootPrefix + href : "#";
    return '<div class="nav-node' + openClass + '"><div class="nav-row">'
      + '<button class="' + toggleClass + '"><i class="ti ti-chevron-right"></i></button>'
      + '<a class="' + linkClass + '" href="' + linkHref + '">' + esc(label) + '</a></div>'
      + (childrenHtml ? '<div class="nav-children">' + childrenHtml + '</div>' : '')
      + '</div>';
  }
  function renderDrops(drops){ return drops.map(function(d){ return nodeHtml(d.label, d.href, ''); }).join(''); }
  function renderWeeks(weeks){ return weeks.map(function(w){ return nodeHtml(w.label, w.href, renderDrops(w.drops)); }).join(''); }
  function renderLeagues(leagues){ return leagues.map(function(l){ return nodeHtml(l.label, l.href, renderWeeks(l.weeks)); }).join(''); }
  function renderDesigns(designs){ return designs.map(function(d){ return nodeHtml(d.label, d.href, renderLeagues(d.leagues)); }).join(''); }

  fetch(rootPrefix + "manifest.json")
    .then(function(r){ return r.json(); })
    .then(function(data){ document.getElementById('sidebar-tree').innerHTML = renderDesigns(data.designs); })
    .catch(function(e){ console.error('Sidebar manifest failed to load', e); });

  document.getElementById('sidebar-tree').addEventListener('click', function(e){
    var btn = e.target.closest('.nav-toggle');
    if(btn && !btn.classList.contains('leaf')){ btn.closest('.nav-node').classList.toggle('open'); }
  });

  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebar-backdrop');
  var hamburger = document.getElementById('hamburger-btn');
  if(hamburger){ hamburger.addEventListener('click', function(){ sidebar.classList.add('open'); backdrop.classList.add('open'); }); }
  if(backdrop){ backdrop.addEventListener('click', function(){ sidebar.classList.remove('open'); backdrop.classList.remove('open'); }); }
})();
</script>
</body></html>
