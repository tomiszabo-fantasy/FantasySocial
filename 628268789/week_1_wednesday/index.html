<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>THE OGs — Week 1 Preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0A0B14;background-image:radial-gradient(circle at 10% 0%, rgba(255,122,26,0.15), transparent 40%),radial-gradient(circle at 90% 100%, rgba(34,229,255,0.12), transparent 40%);color:#F5F6FA;font-family:'Inter',sans-serif;min-height:100vh;padding:32px 16px 60px;}
h1{font-family:'Anton',sans-serif;font-size:24px;text-align:center;letter-spacing:0.5px;margin-bottom:4px;}
.subtitle{text-align:center;color:#7A7D96;font-size:11px;margin-bottom:24px;letter-spacing:1px;text-transform:uppercase;}
.grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:14px;max-width:520px;margin:0 auto;}
@media (min-width:640px){.grid{grid-template-columns:repeat(3, 1fr);max-width:760px;}}
.thumb{position:relative;background:#15171f;border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;}
.thumb img{width:100%;display:block;}
.share-btn{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:none;background:linear-gradient(135deg, #FF7A1A, #22E5FF);color:#0A0B14;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
</style></head>
<body>
<h1>THE OGs</h1>
<div class="subtitle">Week 1 &middot; Wednesday Preview</div>
<div class="grid"><div class="thumb">
<img src="1_full_weekly_schedule.png" alt="Card 1"/>
<button class="share-btn" onclick="shareImage('1_full_weekly_schedule.png')"><i class="ti ti-share-2"></i></button>
</div><div class="thumb">
<img src="2_matchup_preview_1.png" alt="Card 2"/>
<button class="share-btn" onclick="shareImage('2_matchup_preview_1.png')"><i class="ti ti-share-2"></i></button>
</div><div class="thumb">
<img src="2_matchup_preview_2.png" alt="Card 3"/>
<button class="share-btn" onclick="shareImage('2_matchup_preview_2.png')"><i class="ti ti-share-2"></i></button>
</div><div class="thumb">
<img src="2_matchup_preview_3.png" alt="Card 4"/>
<button class="share-btn" onclick="shareImage('2_matchup_preview_3.png')"><i class="ti ti-share-2"></i></button>
</div><div class="thumb">
<img src="3_game_of_the_week.png" alt="Card 5"/>
<button class="share-btn" onclick="shareImage('3_game_of_the_week.png')"><i class="ti ti-share-2"></i></button>
</div></div>
<script>
async function shareImage(filename){
  try{
    const resp = await fetch(filename);
    const blob = await resp.blob();
    const file = new File([blob], filename, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Fantasy Social'});
    } else {
      const a = document.createElement('a');
      a.href = filename; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
    }
  }catch(e){ console.error(e); }
}
</script>
</body></html>
