<script>
const galleryImages = ['1_full_weekly_schedule.png','2_matchup_preview_1.png','2_matchup_preview_2.png','2_matchup_preview_3.png','2_matchup_preview_4.png','2_matchup_preview_5.png','3_game_of_the_week.png','4_power_rankings.png','5_joes_picks.png'];
let lightboxIndex = 0;
function updateLightboxShareLinks(){
  const fn = galleryImages[lightboxIndex];
  const cardUrl = new URL(fn, window.location.href).href;
  const cardTitle = "BUDAPEST FILMMAKERS — Week 1 Preview" + " — Card " + (lightboxIndex + 1);
  document.getElementById('lb-wa').href = "https://wa.me/?text=" + encodeURIComponent(cardTitle + " " + cardUrl);
  document.getElementById('lb-x').href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(cardTitle) + "&url=" + encodeURIComponent(cardUrl);
  document.getElementById('lb-fb').href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(cardUrl);
  document.getElementById('lb-mail').href = "mailto:?subject=" + encodeURIComponent(cardTitle) + "&body=" + encodeURIComponent(cardUrl);
}
function openLightbox(index){
  lightboxIndex = index;
  document.getElementById('lightbox-img').src = galleryImages[lightboxIndex];
  document.getElementById('lightbox').classList.add('open');
  updateLightboxShareLinks();
}
function stepLightbox(delta){
  lightboxIndex = (lightboxIndex + delta + galleryImages.length) % galleryImages.length;
  document.getElementById('lightbox-img').src = galleryImages[lightboxIndex];
  updateLightboxShareLinks();
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', function(e){
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key === 'ArrowLeft') stepLightbox(-1);
  if(e.key === 'ArrowRight') stepLightbox(1);
  if(e.key === 'Escape') closeLightbox();
});
async function shareImage(filename){
  try{
    const resp = await fetch(filename);
    const blob = await resp.blob();
    const file = new File([blob], filename, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Fantasy Social'});
    } else {
      const a = document.createElement('a');
      a.href = filename; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
    }
  }catch(e){ console.error(e); }
}
</script></div></div>

<script>
(function(){
  var rootPrefix = "../../../";
  var repoBase = "/FantasySocial/";
  var currentPath = decodeURIComponent(window.location.pathname);
  var idx = currentPath.indexOf(repoBase);
  var relPath = idx >= 0 ? currentPath.slice(idx + repoBase.length) : "";

  function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function nodeHtml(label, href, childrenHtml){
    var isLeaf = !childrenHtml;
    var decodedHref = href ? decodeURIComponent(href) : "";
    var isActive = decodedHref && decodedHref === relPath;
    var isAncestor = decodedHref && relPath.indexOf(decodedHref) === 0 && decodedHref !== relPath;
    var openClass = isAncestor ? " open" : "";
    var linkClass = isActive ? "nav-link active" : "nav-link";
    var toggleClass = isLeaf ? "nav-toggle leaf" : "nav-toggle";
    var linkHref = href ? rootPrefix + href : "#";
    return '<div class="nav-node' + openClass + '"><div class="nav-row">'
      + '<button class="' + toggleClass + '"><i class="ti ti-chevron-right"></i></button>'
      + '<a class="' + linkClass + '" href="' + linkHref + '">' + esc(label) + '</a></div>'
      + (childrenHtml ? '<div class="nav-children">' + childrenHtml + '</div>' : '')
      + '</div>';
  }
  function renderDrops(drops){ return drops.map(function(d){ return nodeHtml(d.label, d.href, ''); }).join(''); }
  function renderWeeks(weeks){ return weeks.map(function(w){ return nodeHtml(w.label, w.href, renderDrops(w.drops)); }).join(''); }

  fetch(rootPrefix + "manifest.json")
    .then(function(r){ return r.json(); })
    .then(function(data){ document.getElementById('sidebar-tree').innerHTML = renderWeeks(data.weeks); })
    .catch(function(e){ console.error('Sidebar manifest failed to load', e); });

  document.getElementById('sidebar-tree').addEventListener('click', function(e){
    var btn = e.target.closest('.nav-toggle');
    if(btn && !btn.classList.contains('leaf')){ btn.closest('.nav-node').classList.toggle('open'); }
  });

  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebar-backdrop');
  var hamburger = document.getElementById('hamburger-btn');
  if(hamburger){ hamburger.addEventListener('click', function(){ sidebar.classList.add('open'); backdrop.classList.add('open'); }); }
  if(backdrop){ backdrop.addEventListener('click', function(){ sidebar.classList.remove('open'); backdrop.classList.remove('open'); }); }
})();
</script>
