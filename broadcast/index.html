<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Broadcast</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0A0B14;background-image:radial-gradient(circle at 10% 0%, rgba(255,122,26,0.15), transparent 40%),radial-gradient(circle at 90% 100%, rgba(34,229,255,0.12), transparent 40%);color:#F5F6FA;font-family:'Inter',sans-serif;min-height:100vh;padding:40px 16px 60px;}
a{color:inherit;text-decoration:none;}
h1{font-family:'Anton',sans-serif;font-size:28px;text-align:center;letter-spacing:0.5px;margin-bottom:4px;text-shadow:0 0 16px rgba(255,122,26,0.5);}
.subtitle{text-align:center;color:#7A7D96;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:28px;}
.grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:16px;max-width:420px;margin:0 auto;}
.tile{background:#15171f;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:28px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
.tile i{font-size:32px;color:#22E5FF;}
.tile-label{font-family:'Anton',sans-serif;font-size:15px;}
.tile-sub{font-size:11px;color:#7A7D96;text-transform:uppercase;letter-spacing:0.5px;}
.empty{text-align:center;color:#7A7D96;font-size:14px;}
</style></head>
<body>
<h1>Broadcast</h1>
<div class="subtitle">Fantasy Social</div>
<div class="grid"><a class="tile" href="the-ogs/">
<i class="ti ti-folder"></i>
<div class="tile-label">THE OGs</div>
</a><a class="tile" href="gridiron-gladiators/">
<i class="ti ti-folder"></i>
<div class="tile-label">GRIDIRON GLADIATORS</div>
</a></div>
</body></html>
